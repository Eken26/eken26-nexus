<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eken26 Nexus Tr</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
  // RESMI KALIP: Scriptin hemen altında, beklemeden init et
  Pi.init({ version: "2.0" });
</script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f5f5f5;color:#111}
.top{background:#fff;padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}
.card{background:#fff;margin:14px;border-radius:16px;padding:16px}
.price{color:#7c3aed;font-size:32px;font-weight:bold}
button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
.btn-buy{background:#7c3aed;color:#fff}
.btn-cancel{background:#fff;border:1px solid #ddd}
#status{margin:14px;padding:12px;border-radius:10px;text-align:center;font-weight:bold}
.ok{background:#dcfce7;color:#166534}
.no{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div class="top"><b>π Eken26 Nexus Tr</b><span>Logout</span></div>
<div id="status" class="no">⏳ Kontrol ediliyor...</div>

<div class="card">
<h2>Eken26 Nexus Oto Galeri, al sat takas, temiz ikinci el araç</h2>
<p>Eken26 Nexus Oto Galeri, al sat takas hepsi var. Temiz ikinci el araç alıyoruz, satıyoruz, takas...</p>
<div class="price">15π</div>
<p>Durum: New</p>
<p>📍 Eskişehir Türkiye</p>
<p><b>mustafaeken26</b> ⭐⭐⭐⭐⭐ (0)</p>
<button class="btn-buy" onclick="buyProduct()">15π ile Satın Al</button>
<button class="btn-cancel">İptal Et</button>
</div>

<script>
const Pi = window.Pi;
function onIncompletePaymentFound(payment){ console.log(payment); }

// Sayfa açılınca kontrol et - ama Pi.init yukarıda zaten yapıldı
document.addEventListener("DOMContentLoaded", function(){
  const el = document.getElementById('status');
  if (typeof Pi !== 'undefined' && Pi) {
    el.className = "ok";
    el.style.margin="14px"; el.style.padding="12px"; el.style.borderRadius="10px"; el.style.textAlign="center"; el.style.fontWeight="bold";
    el.innerHTML = "✅ Pi SDK bulundu - Satın Al çalışıyor";
  } else {
    el.innerHTML = "❌ Pi SDK bulunamadı - Lütfen Pi Browser kullanın.";
  }
});

async function buyProduct(){
  try{
    const scopes = ['username','payments'];
    const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
    alert("Hoşgeldin @" + auth.user.username);
    Pi.createPayment({
      amount: 15,
      memo: "Eken26 Nexus Oto Galeri",
      metadata: { product: "oto-galeri" }
    }, {
      onReadyForServerApproval: function(id){ console.log(id); },
      onReadyForServerCompletion: function(id, txid){ alert("Ödeme başarılı! " + txid); },
      onCancel: function(){ alert("İptal edildi"); },
      onError: function(e){ alert("Hata: " + e); }
    });
  }catch(e){ alert("Giriş / Ödeme olmadı: " + e.message); }
}
</script>
</body>
</html>
